plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'dev.spendsense'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.spendsense.mobile'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '2.1'
    }
    buildTypes { debug { applicationIdSuffix '.debug' } }
    if (System.getenv('SIGNING_STORE_FILE')) {
        def signingFile = file(System.getenv('SIGNING_STORE_FILE'))
        def password = System.getenv('SIGNING_STORE_PASSWORD')
        def keys = java.security.KeyStore.getInstance('PKCS12')
        signingFile.withInputStream { keys.load(it, password.toCharArray()) }
        def aliases = keys.aliases().toList().findAll { keys.isKeyEntry(it) }
        if (aliases.size() != 1) throw new GradleException('Expected a single signing key')
        signingConfigs {
            production {
                storeFile signingFile
                storeType 'PKCS12'
                storePassword password
                keyAlias aliases.first()
                keyPassword password
            }
        }
        buildTypes.release.signingConfig = signingConfigs.production
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
