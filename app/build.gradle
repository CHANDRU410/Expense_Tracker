plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'dev.spendsense'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.spendsense'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }
    if (System.getenv('SIGNING_STORE_FILE')) {
        signingConfigs {
            production {
                storeFile file(System.getenv('SIGNING_STORE_FILE'))
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
        buildTypes.release.signingConfig = signingConfigs.production
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
