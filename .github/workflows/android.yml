name: Build SpendSense APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Test dashboard interactions
        run: python3 tests/dashboard.py
      - name: Test, build and verify APK
        env:
          STORE_DATA: ${{ secrets.SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "$STORE_DATA" ]]; then
            export SIGNING_STORE_FILE="$RUNNER_TEMP/signing.keystore"
            printf %s "$STORE_DATA" | base64 --decode > "$SIGNING_STORE_FILE"
            gradle --no-daemon testDebugUnitTest assembleRelease
            cp app/build/outputs/apk/release/app-release.apk SpendSense.apk
          else
            gradle --no-daemon testDebugUnitTest assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk SpendSense.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose SpendSense.apk
          sha256sum SpendSense.apk > SpendSense.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SpendSense-Android
          path: |
            SpendSense.apk
            SpendSense.apk.sha256
      - name: Publish phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT" SpendSense.apk SpendSense.apk.sha256 --target "$GITHUB_SHA" --title "SpendSense · build $GITHUB_RUN_NUMBER" --notes "Download SpendSense.apk on your Android phone. See README for tracking coverage and signing information."

