name: Build SpendSense APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spendsense-android-main
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Test dashboard interactions
        run: python3 tests/dashboard.py
      - name: Test and assemble permanent application
        env:
          SIGNING_BUNDLE: ${{ secrets.SPENDSENSE_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          umask 077
          export SIGNING_STORE_FILE="$RUNNER_TEMP/spendsense.p12"
          if [[ -z "$SIGNING_BUNDLE" ]]; then
            export SIGNING_STORE_PASSWORD="$(openssl rand -hex 24)"
            keytool -genkeypair -storetype PKCS12 -keystore "$SIGNING_STORE_FILE" -storepass:env SIGNING_STORE_PASSWORD -keypass:env SIGNING_STORE_PASSWORD -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI verification only"
            echo "Private release signing is not configured. Running verification only." >> "$GITHUB_STEP_SUMMARY"
          else
            export SIGNING_STORE_PASSWORD="$(jq -er '.password | select(type=="string" and length>=16)' <<< "$SIGNING_BUNDLE")"
            echo "::add-mask::$SIGNING_STORE_PASSWORD"
            jq -er '.pfx' <<< "$SIGNING_BUNDLE" | base64 --decode > "$SIGNING_STORE_FILE"
            echo "signed_release=true" >> "$GITHUB_ENV"
          fi
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          unset SIGNING_BUNDLE
          gradle --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SpendSense.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs SpendSense.apk > "$RUNNER_TEMP/certificate.txt"
          sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certificate.txt" > signing-cert.sha256
          grep -Eq '^[[:xdigit:]]{64}$' signing-cert.sha256
          "$tools/aapt" dump badging SpendSense.apk | grep '^package:' > "$RUNNER_TEMP/package.txt"
          grep -F "name='dev.spendsense.mobile'" "$RUNNER_TEMP/package.txt"
          grep -F "versionCode='$GITHUB_RUN_NUMBER'" "$RUNNER_TEMP/package.txt"
          sha256sum SpendSense.apk > SpendSense.apk.sha256
      - name: Publish update with matching certificate
        if: env.signed_release == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$(gh release view --json tagName --jq .tagName)"
          case "$previous" in
            build-2-1|build-3-1) ;; # Initial transition from disposable test builds.
            stable-*)
              previous_code="${previous#stable-}"
              if (( previous_code >= GITHUB_RUN_NUMBER )); then
                echo "A release with this version code or higher already exists."
                exit 0
              fi
              gh release download "$previous" -p signing-cert.sha256 -D "$RUNNER_TEMP/prior"
              cmp signing-cert.sha256 "$RUNNER_TEMP/prior/signing-cert.sha256"
              ;;
            *) echo "Unknown release lineage. Check signing before publishing."; exit 1 ;;
          esac
          gh release create "stable-$GITHUB_RUN_NUMBER" SpendSense.apk SpendSense.apk.sha256 signing-cert.sha256 --latest --target "$GITHUB_SHA" --title "SpendSense · update $GITHUB_RUN_NUMBER" --notes "Open SpendSense.apk on Android. After the first stable installation, choose Update to keep your ledger."
